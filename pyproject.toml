[project]
name = "reznar-take-home"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.1",
    "pgserver>=0.1",
    "pydantic>=2",
    "python-stdnum>=2.2",
    "us>=3.2.0",
    "py-moneyed>=3.0",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "pypdfium2>=4",
    "pillow>=10",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reznar"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
